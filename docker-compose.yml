services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DATA_DIR: /data
    volumes: ["./data:/data"]
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DATA_DIR: /data
    volumes:
      - ./data:/data
      # HOST_CACHE_DIR must be an absolute path to the host's cache root
      # (parent of huggingface/modelscope/torch), set in .env. Deliberately
      # NOT ${HOME}: docker compose reads .env directly for interpolation,
      # independent of the invoking shell, so this avoids the
      # HOME-vs-USERPROFILE split between Git Bash and native
      # PowerShell/cmd.exe on Windows. See .env.example for the expected
      # format per OS.
      - ${HOST_CACHE_DIR}/huggingface:/root/.cache/huggingface
      - ${HOST_CACHE_DIR}/modelscope:/root/.cache/modelscope
      - ${HOST_CACHE_DIR}/torch:/root/.cache/torch
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
